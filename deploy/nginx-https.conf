# are-chat 单镜像 nginx 主配置（HTTPS 版 · 归档备份）
#
# 【这是什么】HTTPS 部署方案的完整 nginx 配置备份。当前 deploy/nginx.conf 已切回 HTTP，
#   本文件平时不参与构建，只在需要重新启用 HTTPS 时使用。
#
# 【如何切回 HTTPS】
#   1) 配置：cp deploy/nginx.conf deploy/nginx-http.conf.backup && cp deploy/nginx-https.conf deploy/nginx.conf
#   2) 端口：docker-compose.yml 恢复 `- "${HTTPS_PORT:-5443}:443"` 端口映射
#            （APP_PORT 同时保留 `:80`，用于 301 跳转与 ACME 续期挑战）
#   3) 证书：docker-compose.yml 恢复 `- ./certs:/etc/nginx/certs:ro` 挂载，
#            并确保 deploy/certs/ 下有 fullchain.pem + privkey.pem（见 certs/README.md、DEPLOY.md 第 11 节）
#   4) 重启：cd are-chat && docker compose -f deploy/docker-compose.yml up -d
#   5) 重打业务镜像（nginx.conf 是 COPY 进镜像的）：./deploy/build-business.sh
#   注意：PWA「安装到桌面」必须有安全上下文（HTTPS 或 localhost），HTTP + 局域网 IP 下装不上。
#
# 拓扑：浏览器 --HTTPS--> nginx:443（TLS 终止）→ 静态文件 / 反代 → Java:8080（容器内 127.0.0.1）
#       浏览器 --HTTP---> nginx:80  → 仅放行 ACME 证书续期挑战，其余 301 跳转 HTTPS
# 证书：宿主机 deploy/certs/{fullchain.pem, privkey.pem} 由 compose 只读挂载到 /etc/nginx/certs
#       （PWA「安装到桌面」需要安全上下文：HTTPS 或 localhost；日志走 stdout/stderr，docker logs 可见）
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # 发行版自带的 mime.types 未必包含 webmanifest：缺了会以 application/octet-stream
    # 返回 manifest，Chrome 据此判定站点不可安装（PWA 安装入口不出现）
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 上传接口上限与后端 multipart 限制（25MB）保持一致
    client_max_body_size 25m;

    # —— HTTP(80)：ACME HTTP-01 续期挑战直通 + 其余 301 到 HTTPS ——
    server {
        listen 80;
        server_name _;

        # certbot webroot 模式：宿主机把续期挑战目录挂到 /var/www/certbot（可省略，未挂载时该路径 404 不影响跳转）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # —— HTTPS(443)：正式入口（PWA / wss / API 都走这里）——
    server {
        # Ubuntu Noble 的 nginx 1.24 用旧版合并语法；升级 1.25+ 后可改为 listen 443 ssl; http2 on;
        listen 443 ssl http2;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # TLS 证书与协议
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # HSTS：让浏览器之后强制走 HTTPS（开启后一年内该域名无法再回退 HTTP，测试期保持注释）
        # add_header Strict-Transport-Security "max-age=31536000" always;

        # 带内容 hash 的静态资源可以长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # REST API → Spring Boot（127.0.0.1，不对外）；X-Forwarded-Proto=https 让后端会话 Cookie 带 Secure
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 聊天室 → Spring Boot（浏览器侧 wss://，容器内仍是 ws://）
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Vue Router history 模式回退
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
