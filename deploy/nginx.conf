# are-chat 单镜像 nginx 主配置（HTTP 版）
# 拓扑：浏览器 --HTTP--> nginx:80 → 静态文件 / 反代 → Java:8080（容器内 127.0.0.1）
#       （后端只监听 127.0.0.1，不对外暴露；日志走 stdout/stderr，docker logs 可见）
#
# 注意：HTTP 属非安全上下文，浏览器不会注册 Service Worker，PWA「一键安装到桌面」不可用
#       （应用内会提示「HTTP 访问无法一键安装，可手动添加」；localhost 访问不受此限制）。
#       HTTPS 方案已完整备份为 deploy/nginx-https.conf，需要时按该文件头部说明切回。
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # 发行版自带的 mime.types 未必包含 webmanifest：缺了会以 application/octet-stream
    # 返回 manifest，Chrome 据此判定站点不可安装（PWA 安装入口不出现）
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 上传接口上限与后端 multipart 限制（25MB）保持一致
    client_max_body_size 25m;

    # Vue 静态资源 + Spring Boot 反向代理（80 为唯一入口）
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 带内容 hash 的静态资源可以长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # REST API → Spring Boot（127.0.0.1，不对外）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 聊天室 → Spring Boot（浏览器侧 ws://，容器内同样 ws://）
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Vue Router history 模式回退
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
