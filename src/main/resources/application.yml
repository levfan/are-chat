server:
  port: 8080

spring:
  application:
    name: are-chat
  # 默认使用 H2 内存库：开箱即用，无需安装数据库（建表脚本见 schema.sql，仅嵌入式库自动执行）
  datasource:
    url: jdbc:h2:mem:arechat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # MP starter 的自动配置面向 Boot 3，Boot 4 下改由 MybatisPlusConfig 手工装配
  autoconfigure:
    exclude: com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

arechat:
  storage:
    base-dir: ./uploads
  # 77 管理员引导：库里没有 ADMIN 时自动创建该账号（生产请用环境变量覆盖默认密码）
  admin:
    username: ${ARECHAT_ADMIN_USERNAME:admin}
    password: ${ARECHAT_ADMIN_PASSWORD:admin123456}
  # 78 注册审批通知（全部免费渠道，按需配置，可同时启用多个；都不配则仅站内待办）
  # 企业微信群机器人 Webhook：免费、无条数限制，推荐首选（企业微信建群 → 添加群机器人 → 复制 Webhook）
  notify:
    wecom-webhook: ${ARECHAT_NOTIFY_WECOM_WEBHOOK:}
    # WxPusher（https://wxpusher.zjiecode.com 免费）：appToken + 关注后拿到的 uid（逗号分隔）
    wxpusher-app-token: ${ARECHAT_NOTIFY_WXPUSHER_TOKEN:}
    wxpusher-uids: ${ARECHAT_NOTIFY_WXPUSHER_UIDS:}
    # Server酱（https://sct.ftqq.com 免费额度每天 5 条）：SendKey
    serverchan-sendkey: ${ARECHAT_NOTIFY_SERVERCHAN_KEY:}
  # 86 敏感词过滤：mode=censor 替换为 ＊ / block 直接拦截；词库可继续追加
  moderation:
    enabled: true
    mode: censor
    sensitive-words: []
  # 87 发送频率限制（防刷屏）：单用户每分钟最多条数
  im:
    send-limit-per-minute: 30

logging:
  level:
    com.smart.chat: INFO
