# 测试专用配置：覆盖主配置的 datasource（test classpath 优先），单测固定走 H2 内存库，
# 避免跑测试时误连外部 MariaDB。其余业务配置与主配置保持一致。
server:
  port: 8080

spring:
  application:
    name: are-chat
  datasource:
    url: jdbc:h2:mem:arechat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 与主配置相同的 Flyway 设置：H2 测试库与外部库统一由 Flyway 执行 db/ 下 V 脚本建表（V1 couple 表 + V2 存量表基线）
  flyway:
    enabled: true
    locations: classpath:db
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  # Boot 4 中 Flyway 先于脚本初始化执行，schema.sql 已退役为结构文档，必须关闭 sql.init 防止重复建表冲突
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # MP starter 的自动配置面向 Boot 3，Boot 4 下改由 MybatisPlusConfig 手工装配
  autoconfigure:
    exclude: com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

arechat:
  storage:
    base-dir: ./target/test-uploads
  admin:
    username: admin
    password: admin123456
  notify:
    wecom-webhook: ""
    wxpusher-app-token: ""
    wxpusher-uids: ""
    serverchan-sendkey: ""
    xtuis-sendkey: ""
  moderation:
    enabled: true
    mode: censor
    sensitive-words: []
  im:
    send-limit-per-minute: 30

logging:
  # 与主配置一致：接口日志行首的 ✓/⚠/✗ 需要 UTF-8 控制台才不会被打成 ?
  charset:
    console: UTF-8
  level:
    com.smart.chat: INFO
