# are-chat 前后端一体化部署（本文件在后端项目内）
# 用法：cd are-chat && docker compose up -d --build
# 访问：http://localhost/（nginx 80 端口统一入口，/api 与 /ws 由 nginx 反代到容器内后端）
# 前端源码目录需与后端同级：../are-chat-web

name: are-chat

services:
  app:
    build:
      context: .                            # 后端项目（构建文件全部在本目录）
      dockerfile: Dockerfile
      additional_contexts:
        web: ../are-chat-web        # 前端源码作为额外上下文进入同一镜像
    image: are-chat:1.0.0
    container_name: are-chat
    ports:
      - "${APP_PORT:-80}:80"                # 宿主机端口可通过 .env 的 APP_PORT 覆盖
    environment:
      TZ: Asia/Shanghai
      ARECHAT_STORAGE_BASE_DIR: /data/uploads   # 上传文件目录（已挂卷持久化）
      # JAVA_OPTS: -Xmx1g
      # —— 需要连接老项目 MySQL 时，取消下面注释并填入真实信息 ——
      # SPRING_PROFILES_ACTIVE: mysql
      # MYSQL_HOST: 192.168.1.100
      # MYSQL_PORT: "3306"
      # MYSQL_DB: arechat
      # MYSQL_USERNAME: root
      # MYSQL_PASSWORD: change-me
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  uploads:
